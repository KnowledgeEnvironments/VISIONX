name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  script-syntax:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n Scripts/*.sh
      - name: Check Python scripts
        run: python3 -m compileall -q Scripts
